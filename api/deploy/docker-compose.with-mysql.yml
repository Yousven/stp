# Variant docker-compose.prod.yml jaoks, kui serveris EI OLE juba
# olemasolevat MySQL instantsi (nt uus tühi VM). Lisab MySQL konteineri
# koos API-ga samasse stacki.
#
# Kasutamine (töökataloogist `api/`):
#   1. Lisa api/.env faili (vt .env.example) rida:
#        MYSQL_APP_PASSWORD="<openssl rand -hex 16 väljund>"
#      ja kasuta sama väärtust DATABASE_URL-is:
#        DATABASE_URL="mysql://app:<sama parool>@mysql:3306/time_tracking"
#   2. Käivita KINDLASTI --env-file lipuga, muidu ei leia compose
#      MYSQL_APP_PASSWORD muutujat üles (vaikimisi otsib .env faili
#      compose-faili enda kataloogist, mitte cwd-st):
#        docker compose -f deploy/docker-compose.with-mysql.yml --env-file .env up -d --build
#   3. Andmebaasi skeem: docker compose ... exec api npx prisma db push

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: time_tracking
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      # Juurkaust, sest image sisaldab ka desktop-liidest (mobile/).
      context: ../..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
