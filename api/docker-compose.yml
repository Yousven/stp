# Kohalik arenduskeskkond: ainult MySQL (+ Adminer DB vaatamiseks).
# API ise jookseb otse hostis (`npm run dev`) kiirema hot-reloadi jaoks —
# vt README.md. See MySQL EI OLE Proxmoxi toodangu andmebaas, vaid puhas
# kohalik test-instants, mida `prisma:seed` täidab demoandmetega.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: time_tracking
      MYSQL_USER: app
      MYSQL_PASSWORD: devpassword
      MYSQL_ROOT_PASSWORD: devrootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_dev_data:
